<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5f7fb">
<title>FitCoach - ورود</title>
<link rel="manifest" href="/static/manifest.json">
<style>
@font-face {
  font-family: 'Vazirmatn';
  src: url('/static/fonts/Vazirmatn-Regular.woff2') format('woff2');
  font-weight: 400; font-display: swap;
}
@font-face {
  font-family: 'Vazirmatn';
  src: url('/static/fonts/Vazirmatn-Bold.woff2') format('woff2');
  font-weight: 700; font-display: swap;
}
</style>
<link rel="stylesheet" href="/static/icons/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/static/css/main.css?v=light-blue-1">
<style>
.login-page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(37,99,235,0.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(37,99,235,0.1) 0%, transparent 50%),
    var(--bg-primary);
  position: relative;
  overflow: hidden;
}
.login-page::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -20%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(37,99,235,0.08) 0%, transparent 70%);
  animation: float 8s ease-in-out infinite;
}
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-30px)} }

.login-card {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 2.5rem;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
}

[data-theme="light"] .login-card {
  background: rgba(255,255,255,0.85);
  border-color: rgba(37,99,235,0.15);
  box-shadow: 0 20px 60px rgba(37,99,235,0.15);
}

.login-logo {
  text-align: center;
  margin-bottom: 2rem;
}
.login-logo-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
  font-size: 2rem;
  color: white;
  box-shadow: 0 8px 30px rgba(37,99,235,0.4);
}
.login-logo h1 {
  font-size: 1.8rem;
  font-weight: 700;
  background: linear-gradient(135deg, #2563eb, #2563eb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.login-logo p {
  color: var(--text-muted);
  font-size: 0.85rem;
  margin-top: 0.3rem;
}

.login-form { display: flex; flex-direction: column; gap: 1.25rem; }

.input-group {
  position: relative;
}
.input-group-icon {
  position: absolute;
  top: 50%; right: 1rem;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.9rem;
  pointer-events: none;
}
.input-group .form-control {
  padding-right: 2.75rem;
}

.password-toggle {
  position: absolute;
  top: 50%; left: 1rem;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 0.9rem;
  padding: 0;
  transition: color 0.2s;
}
.password-toggle:hover { color: var(--accent-light); }
.input-group .form-control { padding-left: 2.75rem; }

.btn-login {
  padding: 0.875rem;
  font-size: 1rem;
  font-weight: 700;
  border-radius: 12px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: white;
  border: none;
  cursor: pointer;
  transition: all 0.25s;
  box-shadow: 0 4px 20px rgba(37,99,235,0.35);
  letter-spacing: 0.03em;
}
.btn-login:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(37,99,235,0.5);
  filter: brightness(1.05);
}
.btn-login:active { transform: translateY(0); }

.support-info {
  text-align: center;
  margin-top: 1.5rem;
  padding-top: 1.5rem;
  border-top: 1px solid var(--glass-border);
}
.support-info p { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.3rem; }
.support-number {
  font-size: 1rem;
  font-weight: 700;
  color: var(--accent-light);
  direction: ltr;
  letter-spacing: 0.05em;
}

.theme-switch {
  position: absolute;
  top: 1rem; left: 1rem;
  width: 36px; height: 36px;
  background: var(--bg-card);
  border: 1px solid var(--glass-border);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 0.9rem;
  transition: all 0.25s;
}
.theme-switch:hover { background: var(--accent); color: white; border-color: var(--accent); }
</style>
<script defer src="/static/js/online-only.js?v=1"></script>
<link rel="stylesheet" href="/static/css/experience.css?v=1">
</head>
<body>
<div class="login-page">
  <section class="auth-story" aria-label="فیت‌کوچ">
    <div class="workspace-eyebrow">YOUR NEXT LEVEL</div>
    <h2>هر روز، یک قدم<br><span>بهتر از دیروز.</span></h2>
    <p>برنامهٔ تمرینی، همراهی مربی و مسیر پیشرفتت؛ همه در یک فضای ساده و منظم.</p>
    <div class="hero-orbit" aria-hidden="true"><div class="hero-symbol"><i class="fas fa-dumbbell"></i></div></div>
  </section>
  <div class="login-card">


    <div class="login-logo">
      <div class="login-logo-icon">
        <i class="fas fa-dumbbell"></i>
      </div>
      <h1>FitCoach</h1>
      <p>سامانه مدیریت تمرین</p>
    </div>

    {% if messages %}
    <div class="messages-container">
      {% for msg in messages %}
      <div class="alert alert-{{ msg.tags }}">
        <i class="fas fa-exclamation-circle"></i>
        {{ msg }}
      </div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="POST" class="login-form" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="username">نام کاربری</label>
        <div class="input-group">
          <i class="fas fa-user input-group-icon"></i>
          <input type="text" name="username" id="username" class="form-control"
                 placeholder="نام کاربری را وارد کنید" required autocomplete="username"
                 value="{{ request.POST.username|default:'' }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">رمز عبور</label>
        <div class="input-group">
          <i class="fas fa-lock input-group-icon"></i>
          <input type="password" name="password" id="password" class="form-control"
                 placeholder="رمز عبور را وارد کنید" required autocomplete="current-password">
          <button type="button" class="password-toggle" onclick="togglePass()" tabindex="-1">
            <i class="fas fa-eye" id="passIcon"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login">
        <i class="fas fa-sign-in-alt"></i> ورود به سامانه
      </button>
    </form>

    <div class="support-info">
      <p><i class="fas fa-headset"></i> پشتیبانی</p>
      <div class="support-number">09331842949</div>
    </div>
  </div>
</div>

<script>
// Theme
document.documentElement.setAttribute('data-theme', 'light');
try { localStorage.setItem('fc_theme', 'light'); } catch (_) {}

function togglePass() {
  const input = document.getElementById('password');
  const icon = document.getElementById('passIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}
</script>
</body>
</html>
