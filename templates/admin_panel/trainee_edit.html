{% extends "admin_panel/base_admin.html" %}
{% block title %}ویرایش شاگرد - FitCoach{% endblock %}
{% block page_title %}ویرایش شاگرد{% endblock %}

{% block content %}
<div class="page-header">
  <h2><i class="fas fa-user-edit text-accent"></i> ویرایش: {{ profile.user.get_full_name }}</h2>
  <a href="{% url 'admin_panel:trainee_list' %}" class="btn btn-outline"><i class="fas fa-arrow-right"></i> بازگشت</a>
</div>
<div class="card" style="max-width:700px">
  <form method="POST">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">نام</label>
        <input type="text" name="first_name" class="form-control" required value="{{ profile.user.first_name }}">
      </div>
      <div class="form-group">
        <label class="form-label">نام خانوادگی</label>
        <input type="text" name="last_name" class="form-control" required value="{{ profile.user.last_name }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">تلفن</label>
        <input type="tel" name="phone" class="form-control" dir="ltr" value="{{ profile.user.phone|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">رمز عبور <span style="font-weight:400;color:var(--text-muted)">(خالی = تغییر نمی‌کند)</span></label>
        <input type="password" name="password" class="form-control" autocomplete="new-password">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">تغییر مربی</label>
      <select name="coach" class="form-control">
        <option value="">بدون مربی</option>
        {% for coach in coaches %}
        <option value="{{ coach.pk }}" {% if profile.coach and profile.coach.pk == coach.pk %}selected{% endif %}>
          {{ coach.get_full_name|default:coach.username }}
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row-3">
      <div class="form-group">
        <label class="form-label">وزن (kg)</label>
        <input type="number" name="weight" class="form-control" dir="ltr" step="0.1" value="{{ profile.weight|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">قد (cm)</label>
        <input type="number" name="height" class="form-control" dir="ltr" step="0.1" value="{{ profile.height|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">سن</label>
        <input type="number" name="age" class="form-control" dir="ltr" value="{{ profile.age|default:'' }}">
      </div>
    </div>
    <div style="display:flex;gap:1rem;justify-content:flex-end">
      <a href="{% url 'admin_panel:trainee_list' %}" class="btn btn-outline">انصراف</a>
      <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> ذخیره</button>
    </div>
  </form>
</div>
{% endblock %}
