<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09090b">
<title>FitCoach — بدون اینترنت</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #09090b;
    color: #eeeef6;
    font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .wrap { padding: 2rem; max-width: 360px; }
  .icon {
    width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 1.5rem;
    background: linear-gradient(135deg, #6c63ff, #4f46e5);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
  }
  h1 { font-size: 1.25rem; margin-bottom: 0.6rem; }
  p { font-size: 0.9rem; color: #9c9cbd; line-height: 1.8; margin-bottom: 1.75rem; }
  button {
    background: linear-gradient(135deg, #6c63ff, #4f46e5); color: white;
    border: none; padding: 0.8rem 1.8rem; border-radius: 12px;
    font-size: 0.9rem; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📶</div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>
      این صفحه قبلاً بازدید نشده بود، برای همین نمی‌شه بدون اینترنت بازش کرد.
      وقتی دوباره وصل شدی، دکمه‌ی زیر رو بزن.
    </p>
    <button onclick="window.location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
